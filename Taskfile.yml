# yaml-language-server: $schema=https://taskfile.dev/schema.json
# A Taskfile.yml as an alternative to Makefile
version: "3.17"

vars:
  BUILD: docker
  CONTAINER_LABEL: local/antora:colabor-documentation

tasks:
  install:
    aliases:
      - i
    desc: Build the Antora Docker image
    cmds:
      - "{{.BUILD}} build -t {{.CONTAINER_LABEL}} antora/"

  build:
    aliases:
      - b
    desc: Generate the Antora site
    # Skip the build when the docs are up to date: no antora source changes
    # since the last commit that generated docs/, and no uncommitted changes.
    status:
      - "git diff --quiet \"$(git log -1 --format=%H -- docs/)\" HEAD -- antora/ antora-playbook.yml && git diff --quiet -- antora/ antora-playbook.yml"
    # Run the Antora container as root to remove the previous site, generate the
    # new one and add .nojekyll. The chown transfers ownership of docs/ to the
    # current user so the host (e.g. the CI runner) can write and commit it.
    # To force a rebuild even when up to date, use: task build --force
    cmds:
      - "{{.BUILD}} run -v .:/antora:z --rm --entrypoint /bin/sh {{.CONTAINER_LABEL}} -c \"rm -rf /antora/docs && antora antora-playbook.yml --stacktrace && touch /antora/docs/.nojekyll && chown -R $(id -u):$(id -g) /antora/docs\""

  server:
    aliases:
      - s
    desc: Serve the generated documentation locally
    dir: docs
    cmds:
      - python3 -m http.server

  shell:
    aliases:
      - sh
    desc: Open a shell inside the Antora container
    cmds:
      - "{{.BUILD}} run -it --entrypoint /bin/sh -v .:/antora:z -t {{.CONTAINER_LABEL}}"

  antora.build:
    aliases:
      - ab
    desc: Run Antora directly from the host
    cmds:
      - antora antora-playbook.yml --stacktrace
