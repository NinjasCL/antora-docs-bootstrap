site:
  title: Example Documentation
  url: https://ninjascl.github.io/antora-docs-bootstrap
  start_page: "ROOT::index.adoc"

content:
  sources:
    - url: .
      branches: HEAD
      start_path: antora/

antora:
  extensions:
    - require: "@antora/lunr-extension"
    # Optional extensions
    #- require: "@antora/pdf-extension"
    #- require: "@antora/epub-extension"

asciidoc:
  extensions:
    - asciidoctor-emoji
    - asciidoctor-kroki
    - "@djencks/asciidoctor-mathjax"
  attributes:
    stem: mathjax
    kroki-fetch-diagram: true
    experimental: ""
    idprefix: ""
    idseparator: "-"
    page-pagination: ""
    highlightjs-theme: monokai
    highlightjs-languages: js, elixir, sql, yaml, html, css, c, python, ada, objc

ui:
  bundle:
  # https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    url: antora/ui-bundle.zip
    snapshot: true
  # https://gitlab.com/antora/antora-ui-default/-/tree/master/src/partials
  supplemental_files: antora/supplemental-ui/

output:
  dir: docs/
